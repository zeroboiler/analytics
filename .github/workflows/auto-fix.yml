name: Auto-fix & Commit

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  fix:
    name: Pint + Rector Auto-fix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.COMPOSER_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Resolve private dependencies
        env:
          COMPOSER_TOKEN: ${{ secrets.COMPOSER_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Clone dependency chain: analytics → response → dto → value-objects
          git clone https://x-access-token:${COMPOSER_TOKEN}@github.com/zeroboiler/value-objects.git /tmp/value-objects
          git clone https://x-access-token:${COMPOSER_TOKEN}@github.com/zeroboiler/dto.git /tmp/dto
          git clone https://x-access-token:${COMPOSER_TOKEN}@github.com/zeroboiler/response.git /tmp/response
          # Inject version fields for path-based packages that lack them
          php -r "
            \$repos = [
              '/tmp/value-objects' => '1.1.0',
            ];
            foreach (\$repos as \$dir => \$ver) {
              \$f = \$dir . '/composer.json';
              \$j = json_decode(file_get_contents(\$f), true);
              if (empty(\$j['version'])) {
                \$j['version'] = \$ver;
                file_put_contents(\$f, json_encode(\$j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . \"\n\");
                echo \"Set \$f version to \$ver\n\";
              }
            }
          "

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Rector
        run: vendor/bin/rector --no-progress-bar

      - name: Run Pint
        run: vendor/bin/pint

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'ci: auto-fix formatting and refactoring'
          file_pattern: '*.php'
