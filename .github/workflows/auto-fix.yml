name: Auto-fix & Commit

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  fix:
    name: Pint + Rector Auto-fix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2


      - name: Configure git and composer auth
        env:
          COMPOSER_TOKEN: ${{ secrets.COMPOSER_TOKEN }}
        run: |
          git config --global url."https://${COMPOSER_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://${COMPOSER_TOKEN}@github.com/".insteadOf "git@github.com:"
          composer config -g github-oauth.github.com "${COMPOSER_TOKEN}"


      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run Rector
        run: vendor/bin/rector --no-progress-bar

      - name: Run Pint
        run: vendor/bin/pint

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'ci: auto-fix formatting and refactoring'
          file_pattern: '*.php'
