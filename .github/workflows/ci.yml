name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2


      - name: Configure git and composer auth
        env:
          COMPOSER_TOKEN: ${{ secrets.COMPOSER_TOKEN }}
        run: |
          git config --global url."https://${COMPOSER_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://${COMPOSER_TOKEN}@github.com/".insteadOf "git@github.com:"
          composer config -g github-oauth.github.com "${COMPOSER_TOKEN}"


      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Pint (Formatting)
        run: vendor/bin/pint --test

      - name: PHPStan (Static Analysis)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Rector (Refactoring Check)
        run: vendor/bin/rector --dry-run --no-progress-bar

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2


      - name: Configure git and composer auth
        env:
          COMPOSER_TOKEN: ${{ secrets.COMPOSER_TOKEN }}
        run: |
          git config --global url."https://${COMPOSER_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://${COMPOSER_TOKEN}@github.com/".insteadOf "git@github.com:"
          composer config -g github-oauth.github.com "${COMPOSER_TOKEN}"


      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Pest (Tests)
        run: vendor/bin/pest --coverage --min=80
